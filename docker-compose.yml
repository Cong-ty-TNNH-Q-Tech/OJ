services:
  db:
    image: mariadb:10.11
    restart: always
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-dmoj}
      MYSQL_USER: ${MYSQL_USER:-dmoj}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-dmoj_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  web:
    build: .
    restart: always
    volumes:
      - .:/app
      - /app/node_modules
      - problems:/problems
    ports:
      - "${WEB_PORT:-8000}:8000"
    environment:
      - DB_HOST=db
      - DB_USER=${MYSQL_USER:-dmoj}
      - DB_PASSWORD=${MYSQL_PASSWORD:-dmoj_password}
      - DB_NAME=${MYSQL_DATABASE:-dmoj}
      - REDIS_HOST=redis
      - ADMIN_USERNAME=${ADMIN_USERNAME}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - ROLE=web
      - DJANGO_SETTINGS_MODULE=dmoj.settings
      - EMAIL_BACKEND=${EMAIL_BACKEND}
      - EMAIL_HOST=${EMAIL_HOST}
      - EMAIL_PORT=${EMAIL_PORT}
      - EMAIL_HOST_USER=${EMAIL_HOST_USER}
      - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD}
      - EMAIL_USE_TLS=${EMAIL_USE_TLS}
      - DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL}
      - SITE_NAME=${SITE_NAME:-ICTU JUDGE}
      - SITE_LONG_NAME=${SITE_LONG_NAME:-ICTU JUDGE}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    command: python manage.py runserver 0.0.0.0:8000

  celery:
    build: .
    restart: always
    volumes:
      - .:/app
      - /app/node_modules
      - problems:/problems
    environment:
      - DB_HOST=db
      - DB_USER=${MYSQL_USER:-dmoj}
      - DB_PASSWORD=${MYSQL_PASSWORD:-dmoj_password}
      - DB_NAME=${MYSQL_DATABASE:-dmoj}
      - REDIS_HOST=redis
      - DJANGO_SETTINGS_MODULE=dmoj.settings
      - EMAIL_BACKEND=${EMAIL_BACKEND}
      - EMAIL_HOST=${EMAIL_HOST}
      - EMAIL_PORT=${EMAIL_PORT}
      - EMAIL_HOST_USER=${EMAIL_HOST_USER}
      - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD}
      - EMAIL_USE_TLS=${EMAIL_USE_TLS}
      - DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL}
      - SITE_NAME=${SITE_NAME:-ICTU JUDGE}
      - SITE_LONG_NAME=${SITE_LONG_NAME:-ICTU JUDGE}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    command: celery -A dmoj worker -l info --concurrency=2

  bridge:
    build: .
    restart: always
    volumes:
      - .:/app
      - /app/node_modules
      - problems:/problems
    ports:
      - "9999:9999"
    environment:
      - DB_HOST=db
      - DB_USER=${MYSQL_USER:-dmoj}
      - DB_PASSWORD=${MYSQL_PASSWORD:-dmoj_password}
      - DB_NAME=${MYSQL_DATABASE:-dmoj}
      - REDIS_HOST=redis
      - DJANGO_SETTINGS_MODULE=dmoj.settings
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    command: python manage.py runbridged

  judge:
    image: dmoj/judge-small:latest
    restart: always
    privileged: true
    volumes:
      - problems:/problems
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
      - ./judge.yml:/judge/judge.yml:ro
    environment:
      - BRIDGE_ADDRESS=bridge
      - JUDGE_NAME=judge1
      - JUDGE_KEY=${JUDGE_KEY:-secret_judge_key_123}
    depends_on:
      - bridge
    command: -p 9999 -s bridge judge1 ${JUDGE_KEY:-secret_judge_key_123}

volumes:
  mysql-data:
  redis-data:
  problems:
